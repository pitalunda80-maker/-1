services:
  - type: web
    name: one-step-demo
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_PATH
        value: /var/data/tasks.sqlite
    disk:
      name: task-data
      mountPath: /var/data
      sizeGB: 1
